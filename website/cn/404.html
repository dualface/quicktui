<script>
(() => {
  let theme = null;
  try {
    const stored = localStorage.getItem('quicktui.theme');
    if (stored === 'dark' || stored === 'light') theme = stored;
  } catch (_) {}
  if (!theme) theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', theme);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', theme === 'dark' ? '#090C09' : '#FAFBF3');
})();

<script>
// Shared site chrome behavior, injected inline at the end of <body> by scripts/build.mjs:
// theme toggle (persisted, follows the system theme until chosen) and language preference
// capture on the EN / CN links (pages are static per language; the link does the switch).
(() => {
  const root = document.documentElement;
  const btn = document.getElementById('themeToggle');
  const meta = document.querySelector('meta[name="theme-color"]');
  const paint = theme => {
    if (btn) btn.textContent = theme === 'dark' ? '◐' : '◑';
    if (meta) meta.setAttribute('content', theme === 'dark' ? '#090C09' : '#FAFBF3');
  };
  const stored = () => {
    try {
      const v = localStorage.getItem('quicktui.theme');
      return v === 'dark' || v === 'light' ? v : null;
    } catch (_) {
      return null;
    }
  };
  const apply = theme => {
    root.setAttribute('data-theme', theme);
    paint(theme);
  };
  paint(root.getAttribute('data-theme') || 'dark');
  if (btn) {
    btn.addEventListener('click', () => {
      const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      apply(next);
      try { localStorage.setItem('quicktui.theme', next); } catch (_) { /* in-memory only */ }
    });
  }
  if (window.matchMedia) {
    const query = window.matchMedia('(prefers-color-scheme: light)');
    const onChange = e => { if (!stored()) apply(e.matches ? 'light' : 'dark'); };
    if (query.addEventListener) query.addEventListener('change', onChange);
    else if (query.addListener) query.addListener(onChange);
  }
  document.querySelectorAll('.qt-lang a[data-lang]').forEach(a => {
    a.addEventListener('click', () => {
      try { localStorage.setItem('quicktui.lang', a.getAttribute('data-lang')); } catch (_) { /* in-memory only */ }
    });
  });
})();
</script>
</body>
</html>
