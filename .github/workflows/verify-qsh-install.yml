name: Verify q.sh Install

'on':
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: verify-qsh-install-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.site }} / ${{ matrix.script }} / ${{ matrix.channel }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: quicktui.ai
            script: q.sh
            channel: stable
            mode: install
          - site: quicktui.ai
            script: q.sh
            channel: preview
            mode: install
          - site: dl.quicktui.cn
            script: q.sh
            channel: stable
            mode: checksum
          - site: dl.quicktui.cn
            script: q.sh
            channel: preview
            mode: checksum

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run disposable Docker verifier
        if: ${{ matrix.mode == 'install' }}
        id: verify
        shell: bash
        env:
          SITE: ${{ matrix.site }}
          SCRIPT: ${{ matrix.script }}
          CHANNEL: ${{ matrix.channel }}
          QT_VERIFY_ARTIFACT_DIR: ${{ runner.temp }}/qt-verify/${{ matrix.site }}/${{ matrix.script }}/${{ matrix.channel }}
        run: |
          set +e
          mkdir -p "$QT_VERIFY_ARTIFACT_DIR"
          {
            echo "site=$SITE"
            echo "script=$SCRIPT"
            echo "channel=$CHANNEL"
            echo "artifact_dir=$QT_VERIFY_ARTIFACT_DIR"
          } >> "$GITHUB_OUTPUT"

          sh monitoring/run-verify-docker.sh \
            --site "$SITE" \
            --script "$SCRIPT" \
            --channel "$CHANNEL"
          exit_code=$?

          if [ ! -s "$QT_VERIFY_ARTIFACT_DIR/qt-verify-install.log" ]; then
            {
              echo "run-verify-docker.sh did not produce qt-verify-install.log"
              echo "site=$SITE"
              echo "script=$SCRIPT"
              echo "channel=$CHANNEL"
              echo "exit_code=$exit_code"
            } > "$QT_VERIFY_ARTIFACT_DIR/qt-verify-install.log"
          fi

          if [ ! -s "$QT_VERIFY_ARTIFACT_DIR/qt-verify-result.json" ]; then
            jq -n \
              --arg site "$SITE" \
              --arg script "$SCRIPT" \
              --arg channel "$CHANNEL" \
              --arg reason "run-verify-docker.sh exited without qt-verify-result.json" \
              --argjson exit_code "$exit_code" \
              '{
                status: "fail",
                site: $site,
                script: $script,
                channel: $channel,
                reason: $reason,
                exit_code: $exit_code,
                generated_by: "verify-qsh-install workflow fallback"
              }' > "$QT_VERIFY_ARTIFACT_DIR/qt-verify-result.json"
          fi

          jq -e . "$QT_VERIFY_ARTIFACT_DIR/qt-verify-result.json" >/dev/null
          status=$(jq -r '.status // "fail"' "$QT_VERIFY_ARTIFACT_DIR/qt-verify-result.json")
          echo "status=$status" >> "$GITHUB_OUTPUT"

          {
            echo "### Verify cell: $SITE / $SCRIPT / $CHANNEL"
            echo
            echo "- exit_code: $exit_code"
            echo "- result_status: $status"
            echo "- artifact_dir: $QT_VERIFY_ARTIFACT_DIR"
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$exit_code"

      - name: Verify CN manifest and asset checksum
        if: ${{ matrix.mode == 'checksum' }}
        shell: bash
        env:
          SITE: ${{ matrix.site }}
          SCRIPT: ${{ matrix.script }}
          CHANNEL: ${{ matrix.channel }}
          QT_VERIFY_ARTIFACT_DIR: ${{ runner.temp }}/qt-verify/${{ matrix.site }}/${{ matrix.script }}/${{ matrix.channel }}
        run: |
          set -uo pipefail

          mkdir -p "$QT_VERIFY_ARTIFACT_DIR"
          result_file="$QT_VERIFY_ARTIFACT_DIR/qt-verify-result.json"
          log_file="$QT_VERIFY_ARTIFACT_DIR/qt-verify-install.log"
          manifest_url="https://${SITE}/server-manifest.json"
          asset="quicktui-server-linux-amd64.gz"
          checksum_asset="${asset}.sha256"
          tag=""
          expected_sha256=""
          actual_sha256=""
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          : > "$log_file"

          write_result() {
            local status=$1
            local reason=$2
            jq -n \
              --arg status "$status" \
              --arg reason "$reason" \
              --arg site "$SITE" \
              --arg script "$SCRIPT" \
              --arg channel "$CHANNEL" \
              --arg manifest_url "$manifest_url" \
              --arg tag "$tag" \
              --arg asset "$asset" \
              --arg checksum_asset "$checksum_asset" \
              --arg expected_sha256 "$expected_sha256" \
              --arg actual_sha256 "$actual_sha256" \
              '{
                status: $status,
                reason: $reason,
                site: $site,
                script: $script,
                channel: $channel,
                manifest_url: $manifest_url,
                expected: {
                  tag: $tag,
                  manifest_url: $manifest_url,
                  asset: $asset,
                  checksum_asset: $checksum_asset,
                  sha256: $expected_sha256
                },
                installed: {
                  tag: ""
                },
                verified: {
                  asset: $asset,
                  sha256: $actual_sha256
                }
              }' > "$result_file"
          }

          fail() {
            printf 'CN checksum verification failed: %s\n' "$1" | tee -a "$log_file" >&2
            write_result fail "$1"
            exit 1
          }

          skip() {
            printf 'CN checksum verification skipped: %s\n' "$1" | tee -a "$log_file"
            write_result skip "$1"
            exit 0
          }

          printf 'Fetching manifest: %s\n' "$manifest_url" | tee -a "$log_file"
          if ! curl -fsSL \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 60 \
            "$manifest_url" \
            -o "$temp_dir/server-manifest.json" >> "$log_file" 2>&1; then
            fail "manifest download failed"
          fi

          if ! jq -e \
            'type == "object" and .schema_version == 1' \
            "$temp_dir/server-manifest.json" >/dev/null 2>> "$log_file"; then
            fail "manifest is not valid schema version 1 JSON"
          fi

          if ! channel_type="$(jq -r \
            --arg channel "$CHANNEL" \
            '.[$channel] | type' \
            "$temp_dir/server-manifest.json" 2>> "$log_file")"; then
            fail "manifest channel cannot be read"
          fi
          if [ "$channel_type" = "null" ]; then
            if [ "$CHANNEL" = "preview" ]; then
              skip "preview manifest channel is missing"
            fi
            fail "manifest channel is missing"
          fi
          if [ "$channel_type" != "object" ]; then
            fail "manifest channel must be an object"
          fi

          if ! tag_type="$(jq -r \
            --arg channel "$CHANNEL" \
            '.[$channel].tag | type' \
            "$temp_dir/server-manifest.json" 2>> "$log_file")"; then
            fail "manifest channel tag cannot be read"
          fi
          if [ "$tag_type" = "null" ]; then
            if [ "$CHANNEL" = "preview" ]; then
              skip "preview manifest tag is missing"
            fi
            fail "manifest channel tag is missing"
          fi
          if [ "$tag_type" != "string" ]; then
            fail "manifest channel tag must be a string"
          fi
          if ! tag="$(jq -r \
            --arg channel "$CHANNEL" \
            '.[$channel].tag' \
            "$temp_dir/server-manifest.json" 2>> "$log_file")"; then
            fail "manifest channel tag cannot be read"
          fi
          if [ -z "$tag" ]; then
            if [ "$CHANNEL" = "preview" ]; then
              skip "preview manifest tag is missing"
            fi
            fail "manifest channel tag is missing"
          fi

          if [ "$CHANNEL" = "stable" ]; then
            if ! [[ "$tag" =~ ^[0-9]{8}-[0-9]{2}$ ]]; then
              fail "manifest stable tag has an invalid shape: $tag"
            fi
          elif ! [[ "$tag" =~ ^server2?-preview-[0-9]{8}-[0-9]{6}-[A-Za-z0-9._-]+$ ]]; then
            fail "manifest preview tag has an invalid shape: $tag"
          fi

          if ! jq -e \
            --arg channel "$CHANNEL" \
            --arg asset "$asset" \
            --arg checksum_asset "$checksum_asset" \
            '.[$channel].assets as $assets
              | ($assets | type == "array")
                and ($assets | index($asset) != null)
                and ($assets | index($checksum_asset) != null)' \
            "$temp_dir/server-manifest.json" >/dev/null 2>> "$log_file"; then
            fail "manifest does not declare $asset and $checksum_asset"
          fi

          asset_base_url="https://${SITE}/releases/download/${tag}"
          printf 'Fetching checksum: %s/%s\n' "$asset_base_url" "$checksum_asset" | tee -a "$log_file"
          if ! curl -fsSL \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 60 \
            "$asset_base_url/$checksum_asset" \
            -o "$temp_dir/$checksum_asset" >> "$log_file" 2>&1; then
            fail "checksum file download failed"
          fi

          expected_sha256="$(awk 'NR == 1 { print tolower($1) }' "$temp_dir/$checksum_asset")"
          if ! [[ "$expected_sha256" =~ ^[0-9a-f]{64}$ ]]; then
            fail "checksum file does not contain a valid SHA-256 digest"
          fi

          printf 'Fetching asset: %s/%s\n' "$asset_base_url" "$asset" | tee -a "$log_file"
          if ! curl -fsSL \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 180 \
            "$asset_base_url/$asset" \
            -o "$temp_dir/$asset" >> "$log_file" 2>&1; then
            fail "asset download failed"
          fi

          actual_sha256="$(sha256sum "$temp_dir/$asset" | awk '{ print tolower($1) }')"
          if [ "$actual_sha256" != "$expected_sha256" ]; then
            fail "asset SHA-256 does not match $checksum_asset"
          fi

          printf 'Verified %s at tag %s with SHA-256 %s\n' \
            "$asset" "$tag" "$actual_sha256" | tee -a "$log_file"
          write_result pass "manifest and asset SHA-256 verified"

          {
            echo "### Verify cell: $SITE / $SCRIPT / $CHANNEL"
            echo
            echo "- mode: checksum"
            echo "- manifest_tag: $tag"
            echo "- verified_asset: $asset"
            echo "- sha256: $actual_sha256"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-result-${{ matrix.site }}-${{ matrix.script }}-${{ matrix.channel }}
          path: ${{ runner.temp }}/qt-verify/${{ matrix.site }}/${{ matrix.script }}/${{ matrix.channel }}/qt-verify-result.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-logs-${{ matrix.site }}-${{ matrix.script }}-${{ matrix.channel }}
          path: |
            ${{ runner.temp }}/qt-verify/${{ matrix.site }}/${{ matrix.script }}/${{ matrix.channel }}/qt-verify-install.log
          if-no-files-found: error
          retention-days: 14

  summary:
    name: Aggregate and report verify results
    runs-on: ubuntu-latest
    needs: verify
    if: always()
    permissions:
      contents: read
      issues: write
    steps:
      - name: Download cell result artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: verify-result-*
          path: verify-results
          merge-multiple: false

      - name: Download cell log artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: verify-logs-*
          path: verify-logs
          merge-multiple: false

      - name: Aggregate and render reports
        id: report
        shell: bash
        run: |
          set -euo pipefail

          report_dir="verify-report"
          mkdir -p "$report_dir"
          failure_report="$report_dir/failure-report.md"
          recovery_report="$report_dir/recovery-report.md"

          expected_cells=$(mktemp)
          cat > "$expected_cells" <<'CELLS'
          quicktui.ai q.sh stable
          quicktui.ai q.sh preview
          dl.quicktui.cn q.sh stable
          dl.quicktui.cn q.sh preview
          CELLS

          pass=0
          fail=0
          skip=0
          missing=0
          invalid=0
          rows_file=$(mktemp)
          failures_table=$(mktemp)

          redact_stream() {
            perl -0pe '
              s/(Authorization\s*[:=]\s*Bearer\s+)[A-Za-z0-9._~+\/=-]+/\1[REDACTED]/gi;
              s/\bBearer\s+[A-Za-z0-9._~+\/=-]+/Bearer [REDACTED]/gi;
              s/((?:access_token|refresh_token|client_secret|api[_-]?key|apikey|auth[_-]?token|token|secret|password|passwd|credential|cookie)\s*[:=]\s*)[^\s,;&|`"<>]+/\1[REDACTED]/gi;
              s/("(?:access_token|refresh_token|client_secret|api[_-]?key|apikey|auth[_-]?token|token|secret|password|passwd|credential|cookie)"\s*:\s*")[^"]*(")/\1[REDACTED]\2/gi;
            '
          }

          md_cell() {
            # shellcheck disable=SC2016
            value=$(printf '%s' "${1:-}" \
              | redact_stream \
              | perl -0pe 'if (length($_) > 1000) { $_ = substr($_, 0, 1000) . " [truncated]" }' \
              | tr '\r\n' '  ' \
              | sed 's/[[:space:]][[:space:]]*/ /g; s/^ //; s/ $//; s/|/\\|/g')
            if [ -n "$value" ]; then
              printf '%s' "$value"
            else
              printf 'n/a'
            fi
          }

          md_log_cell() {
            # shellcheck disable=SC2016
            value=$(printf '%s' "${1:-}" \
              | tail -n 80 \
              | redact_stream \
              | perl -0pe 'if (length($_) > 6000) { $_ = "[truncated]\n" . substr($_, -6000) }' \
              | tr '\r\n' '  ' \
              | sed 's/[[:space:]][[:space:]]*/ /g; s/^ //; s/ $//; s/|/\\|/g')
            if [ -n "$value" ]; then
              printf '%s' "$value"
            else
              printf 'n/a'
            fi
          }

          run_url="${GITHUB_SERVER_URL:-https://github.com}/${GITHUB_REPOSITORY:-unknown}/actions/runs/${GITHUB_RUN_ID:-unknown}"
          workflow_name="${GITHUB_WORKFLOW:-Verify q.sh Install}"
          ref_name="${GITHUB_REF_NAME:-${GITHUB_REF:-unknown}}"
          sha="${GITHUB_SHA:-unknown}"

          {
            echo '| cell | expected | installed | reason | log tail |'
            echo '| --- | --- | --- | --- | --- |'
          } > "$failures_table"

          while read -r site script channel; do
            artifact="verify-result-${site}-${script}-${channel}"
            result="verify-results/${artifact}/qt-verify-result.json"
            log_artifact="verify-logs/verify-logs-${site}-${script}-${channel}/qt-verify-install.log"
            status="missing"
            reason=""
            expected="n/a"
            installed="n/a"
            log_tail=""

            if [ ! -s "$result" ]; then
              missing=$((missing + 1))
              reason="missing result artifact"
            elif ! jq -e . "$result" >/dev/null 2>&1; then
              invalid=$((invalid + 1))
              status="invalid"
              reason="invalid JSON result artifact"
            else
              status=$(jq -r '.status // "fail"' "$result")
              reason=$(jq -r '.reason // .failure_reason // .message // ""' "$result")
              expected=$(jq -r '(.expected.tag // .expected_tag // .manifest_tag // .expected.manifest_tag // "") | tostring' "$result")
              installed=$(jq -r '(.installed.tag // .installed_tag // .version_response_version // .installed.version_response_version // "") | tostring' "$result")
              log_tail=$(jq -r '[.log_tail, .journal_tail] | map(select(type == "string" and length > 0)) | join("\n")' "$result")
              if [ -z "$log_tail" ] && [ -s "$log_artifact" ]; then
                log_tail=$(tail -n 40 "$log_artifact")
              fi
              case "$status" in
                pass|PASS) pass=$((pass + 1)); status="pass" ;;
                skip|SKIP) skip=$((skip + 1)); status="skip" ;;
                fail|FAIL) fail=$((fail + 1)); status="fail" ;;
                *)
                  invalid=$((invalid + 1))
                  reason="unexpected status: $status"
                  status="invalid"
                ;;
              esac
            fi

            # shellcheck disable=SC2016
            printf '| `%s` | `%s` | `%s` | `%s` | %s |\n' "$site" "$script" "$channel" "$status" "$(md_cell "$reason")" >> "$rows_file"
            case "$status" in
              fail|missing|invalid)
                # shellcheck disable=SC2016
                printf '| `%s/%s/%s` | expected=%s | installed=%s | %s | %s |\n' \
                  "$site" \
                  "$script" \
                  "$channel" \
                  "$(md_cell "$expected")" \
                  "$(md_cell "$installed")" \
                  "$(md_cell "$reason")" \
                  "$(md_log_cell "$log_tail")" >> "$failures_table"
                ;;
            esac
          done < "$expected_cells"

          hard_fail=$((fail + missing + invalid))

          {
            echo '### q.sh install verification failing'
            echo
            echo "Run: [${GITHUB_RUN_ID:-unknown}]($run_url)"
            echo "Workflow: $(md_cell "$workflow_name")"
            echo "Ref: $(md_cell "$ref_name")"
            echo "SHA: \`${sha}\`"
            echo "Hard failures: ${hard_fail}"
            echo
            cat "$failures_table"
          } > "$failure_report"

          {
            echo '### q.sh install verification recovered'
            echo
            echo "Run: [${GITHUB_RUN_ID:-unknown}]($run_url)"
            echo "Workflow: $(md_cell "$workflow_name")"
            echo "Ref: $(md_cell "$ref_name")"
            echo "SHA: \`${sha}\`"
            echo
            echo "No hard-fail cells remain. Counts: pass=${pass}, fail=${fail}, skip=${skip}, missing=${missing}, invalid=${invalid}."
          } > "$recovery_report"

          {
            echo '### q.sh install verification'
            echo
            echo "Run: [${GITHUB_RUN_ID:-unknown}]($run_url)"
            echo
            echo "pass=$pass fail=$fail skip=$skip missing=$missing invalid=$invalid hard_fail=$hard_fail"
            echo
            echo '| site | script | channel | status | reason |'
            echo '| --- | --- | --- | --- | --- |'
            cat "$rows_file"
            if [ "$hard_fail" -gt 0 ]; then
              echo
              echo '#### Sanitized hard failures'
              echo
              cat "$failures_table"
            else
              echo
              echo 'No hard failures. Passing and skipped cells are green for monitor purposes.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "hard_fail_count=$hard_fail"
            echo "pass_count=$pass"
            echo "fail_count=$fail"
            echo "skip_count=$skip"
            echo "missing_count=$missing"
            echo "invalid_count=$invalid"
            echo "failure_report_path=$failure_report"
            echo "recovery_report_path=$recovery_report"
          } >> "$GITHUB_OUTPUT"

      - name: Sync monitor issue
        id: sync_monitor_issue
        if: ${{ always() && steps.report.outcome == 'success' }}
        uses: actions/github-script@v7
        env:
          HARD_FAIL_COUNT: ${{ steps.report.outputs.hard_fail_count }}
          FAILURE_REPORT_PATH: ${{ steps.report.outputs.failure_report_path }}
          RECOVERY_REPORT_PATH: ${{ steps.report.outputs.recovery_report_path }}
        with:
          script: |
            const fs = require('fs');

            const monitorTitle = '[monitor] q.sh install verification failing';
            const hardFailCount = Number.parseInt(process.env.HARD_FAIL_COUNT || '0', 10);
            const { owner, repo } = context.repo;
            const maxIssueBodyLength = 60000;

            function limitIssueBody(body) {
              if (body.length <= maxIssueBodyLength) {
                return body;
              }
              const suffix = [
                '',
                '',
                `[truncated to ${maxIssueBodyLength} characters; see the workflow run artifacts for full logs]`,
              ].join('\n');
              return body.slice(0, maxIssueBodyLength - suffix.length) + suffix;
            }

            async function findOpenMonitorIssue() {
              for (let page = 1; ; page += 1) {
                const { data: issues } = await github.rest.issues.listForRepo({
                  owner,
                  repo,
                  state: 'open',
                  per_page: 100,
                  page,
                });
                const match = issues.find((issue) => !issue.pull_request && issue.title === monitorTitle);
                if (match) {
                  return match;
                }
                if (issues.length < 100) {
                  return null;
                }
              }
            }

            try {
              if (hardFailCount > 0) {
                const failureReport = limitIssueBody(fs.readFileSync(process.env.FAILURE_REPORT_PATH, 'utf8'));
                const existingIssue = await findOpenMonitorIssue();
                if (existingIssue) {
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: existingIssue.number,
                    body: failureReport,
                  });
                  core.info(`Appended monitor failure report to issue #${existingIssue.number}.`);
                } else {
                  const issueBody = limitIssueBody([
                    'This issue is managed by the Verify q.sh Install workflow.',
                    '',
                    failureReport,
                  ].join('\n'));
                  const { data: issue } = await github.rest.issues.create({
                    owner,
                    repo,
                    title: monitorTitle,
                    body: issueBody,
                  });
                  core.info(`Created monitor failure issue #${issue.number}.`);
                }
              } else {
                const existingIssue = await findOpenMonitorIssue();
                if (existingIssue) {
                  const recoveryReport = limitIssueBody(fs.readFileSync(process.env.RECOVERY_REPORT_PATH, 'utf8'));
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: existingIssue.number,
                    body: recoveryReport,
                  });
                  await github.rest.issues.update({
                    owner,
                    repo,
                    issue_number: existingIssue.number,
                    state: 'closed',
                    state_reason: 'completed',
                  });
                  core.info(`Closed recovered monitor issue #${existingIssue.number}.`);
                } else {
                  core.info('No open monitor issue to close.');
                }
              }
            } catch (error) {
              core.setFailed(`Issue reporting failed: ${error.message}`);
              throw error;
            }

      - name: Close legacy monitor issue
        if: ${{ always() && steps.report.outcome == 'success' && steps.sync_monitor_issue.outcome == 'success' }}
        uses: actions/github-script@v7
        with:
          script: |
            const legacyTitle = '[monitor] stable install verification failing';
            const { owner, repo } = context.repo;

            async function findOpenLegacyIssue() {
              for (let page = 1; ; page += 1) {
                const { data: issues } = await github.rest.issues.listForRepo({
                  owner,
                  repo,
                  state: 'open',
                  per_page: 100,
                  page,
                });
                const match = issues.find((issue) => !issue.pull_request && issue.title === legacyTitle);
                if (match) {
                  return match;
                }
                if (issues.length < 100) {
                  return null;
                }
              }
            }

            const legacyIssue = await findOpenLegacyIssue();
            if (!legacyIssue) {
              core.info('No open legacy monitor issue to close.');
              return;
            }

            const repository = process.env.GITHUB_REPOSITORY || `${owner}/${repo}`;
            const runUrl = `${process.env.GITHUB_SERVER_URL || 'https://github.com'}/${repository}/actions/runs/${process.env.GITHUB_RUN_ID || ''}`;
            const body = [
              'This legacy monitor issue is superseded by separate installer monitor issues:',
              '',
              '- `[monitor] q.sh install verification failing`',
              '- `[monitor] q2.sh install verification failing`',
              '',
              `Current split workflow run: ${runUrl}`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: legacyIssue.number,
              body,
            });
            await github.rest.issues.update({
              owner,
              repo,
              issue_number: legacyIssue.number,
              state: 'closed',
              state_reason: 'completed',
            });
            core.info(`Closed legacy monitor issue #${legacyIssue.number}.`);

      - name: Fail on hard failures
        if: ${{ always() && steps.report.outcome == 'success' && steps.report.outputs.hard_fail_count != '0' }}
        shell: bash
        run: |
          echo "q.sh install verification reported ${{ steps.report.outputs.hard_fail_count }} hard-fail cell(s)." >&2
          exit 1
